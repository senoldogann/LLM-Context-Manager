[package]
name = "ccm-cli"
version = "0.1.20"
edition = "2021"
authors = ["Senol Dogan"]
description = "CLI for Cognitive Codebase Matrix"
license = "MIT"
repository = "https://github.com/senoldogann/LLM-Context-Manager"

[dependencies]
ccm-core = { path = "../core" }
clap = { version = "4.0", features = ["derive"] }
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
notify = "6.1"
tracing = "0.1"
tracing-subscriber = "0.3"

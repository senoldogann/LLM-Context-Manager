[package]
name = "ccm-mcp"
version = "0.3.6"
edition = "2021"
description = "MCP (Model Context Protocol) Server for CCM"
authors = ["Senol Dogan"]
license = "MIT"
repository = "https://github.com/senoldogann/LLM-Context-Manager"

[[bin]]
name = "ccm-mcp"
path = "src/main.rs"

[dependencies]
ccm-core = { path = "../core" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
lru = "0.18.2"

[dev-dependencies]
assert_cmd = "2.0"
tempfile = "3.8"

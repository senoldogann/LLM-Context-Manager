syntax = "proto3";

package ccm;

service ContextManager {
  // Request context for a specific cursor position
  rpc GetContext (ContextRequest) returns (ContextResponse);
}

message ContextRequest {
  string file_path = 1;
  uint32 line = 2;
  uint32 column = 3;
}

message ContextResponse {
  repeated ContextItem suggestions = 1;
}

message ContextItem {
  string title = 1;
  string content = 2;
  float relevance_score = 3;
  string reason = 4;
}

[package]
name = "ccm-core"
version = "0.1.31"
edition = "2021"
authors = ["Senol Dogan"]
description = "Core engine for Cognitive Codebase Matrix"
license = "MIT"
repository = "https://github.com/senoldogann/LLM-Context-Manager"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = { version = "0.6", features = ["serde-1"] }
sled = "0.34"
bincode = "1.3"
lru = "0.12"
git2 = "0.18"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# LanceDB henüz stabilize olmadığı için temsili versiyon. 
# Gerçek projede güncel crate sürümü kontrol edilmeli.
lancedb = "0.23.1"

# AST Parsing
# Grammar crate versions intentionally diverge from tree-sitter core (0.23-0.26 mix).
# This is safe: the underlying C TSLanguage ABI has been stable across 0.x minor releases.
# Each grammar crate compiles its C parser against its own pinned tree-sitter version; the
# resulting Language pointer is binary-compatible with the 0.26 runtime. Verified by:
# all integration tests pass and 56/56 golden eval tasks succeed.
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
# Java: tree-sitter-java 0.23.5 — LANGUAGE const API, tree-sitter 0.26 uyumlu
# Kotlin: tree-sitter-kotlin-ng (fork) — eski tree-sitter-kotlin 0.3.x uyumsuz (0.22 API)

# Arrow (Explicitly needed for Vector Store)
arrow-array = "56"
arrow-schema = "56"
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
dotenvy = "0.15"
ignore = "0.4"
tree-sitter-java = "0.23.5"
# tree-sitter-kotlin 0.3.x, tree-sitter 0.26 ile uyumsuz — ng fork kullanılıyor
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-c-sharp = "0.23.5"

[dev-dependencies]
tempfile = "3.8"

[package]
name = "ccm-core"
version = "0.1.6"
edition = "2021"
authors = ["Senol Dogan"]
description = "Core engine for Cognitive Codebase Matrix"
license = "MIT"
repository = "https://github.com/senoldogann/LLM-Context-Manager"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
tonic = "0.10"
prost = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
petgraph = { version = "0.6", features = ["serde-1"] }
sled = "0.34"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"

# LanceDB henüz stabilize olmadığı için temsili versiyon. 
# Gerçek projede güncel crate sürümü kontrol edilmeli.
lancedb = "0.23.1"

# AST Parsing
tree-sitter = "0.26"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"

# Arrow (Explicitly needed for Vector Store)
arrow-array = "56"
arrow-schema = "56"
tokio-stream = { version = "0.1", features = ["net"] }
futures = "0.3"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
dotenvy = "0.15"
walkdir = "2.5"

[build-dependencies]
tonic-build = "0.10"

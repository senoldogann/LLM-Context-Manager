name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            name: linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64


    steps:
      - uses: actions/checkout@v4

      - name: Install Protoc (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y protobuf-compiler

      - name: Install Protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        env:
          RUSTFLAGS: ${{ matrix.target == 'x86_64-apple-darwin' && '-C target-feature=-avx,-avx2,-avx512f,-f16c,-fma' || '' }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Binaries
        run: |
          cd target/${{ matrix.target }}/release
          mv ccm-cli ccm-cli-${{ matrix.target }}
          mv ccm-mcp ccm-mcp-${{ matrix.target }}

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: |
            target/${{ matrix.target }}/release/ccm-cli-${{ matrix.target }}
            target/${{ matrix.target }}/release/ccm-mcp-${{ matrix.target }}

  create-release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
          generate_release_notes: true

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v2

      - name: Build binaries
        run: cargo build --release --target ${{ matrix.target }} -p ccm-cli -p ccm-mcp

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/ccm-cli${{ matrix.ext }}" "dist/ccm-cli-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/ccm-mcp${{ matrix.ext }}" "dist/ccm-mcp-${{ matrix.target }}${{ matrix.ext }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ccm-${{ matrix.target }}
          path: dist/*

  release:
    name: Attach Release Assets
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          find dist -type f -maxdepth 2 -print -exec cp {} release/ \;
          scripts/generate_checksums.sh release release/checksums.txt

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: release/*

  publish_npm:
    name: Publish npm Package
    runs-on: ubuntu-latest
    needs: release

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Publish package
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
